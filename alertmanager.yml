Gloabl stream service 
global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'auto-remediator-webhook'

receivers:
  - name: 'auto-remediator-webhook'
    webhook_configs:
      - url: 'http://auto-remediator:5000/webhook'
        send_resolved: true
